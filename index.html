<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Активні черги</title>
    <style>
        :root {
            --bg-l0: #000;
            --bg-l1: rgba(44, 44, 44, 0.6);
            --bg-btn-l1: rgba(255, 255, 255, 0.10);
            --bg-btn-l1-hover: rgba(255, 255, 255, 0.15);
            --text-main: #fff;
            --text-second: #b3b3b3;
            --text-l1: #1a1a1a;
            --accent: #22d3ee;
            --accent-hover: #71d9e2;
            --red: #f55;
            --green: #50fa7b;
            --gap: 20px;
            --border-radius: 20px;
            --transition: 0.3s ease-in-out;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Calibri', 'Arial', sans-serif;
            font-weight: 600;
            color: var(--text-main);
        }

        body {
            padding: var(--gap);
            background-color: var(--bg-l0);
        }

        .blur {
            display: none;
        }

        h1 {
            text-align: center;
            color: var(--accent);
        }

        .header {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: var(--gap);
            margin-bottom: var(--gap);
        }

        .btn button {
            background-color: var(--accent);
            color: var(--text-l1);
            border: none;
            padding: 12px 24px;
            border-radius: var(--border-radius);
            cursor: pointer;
            font-size: 16px;
            transition: var(--transition);
            margin-bottom: 5px;
        }

        .btn button:hover {
            background-color: var(--accent-hover);
        }

        .update-info {
            text-align: center;
            color: var(--text-second);
            font-size: 13px;
            min-height: 30px;
        }

        #results {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: var(--gap);
            transition: var(--transition);
        }

        #results.loading {
            opacity: 0.5;
            pointer-events: none;
        }

        .car-card {
            display: flex;
            flex-direction: column;
            gap: var(--gap);
            background-color: var(--bg-l1);
            padding: var(--gap);
            border-radius: var(--border-radius);
        }

        h3 {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        p {
            color: var(--text-second);
            font-size: 15px;
        }

        .timer-box {
            display: flex;
            justify-content: space-between;
            padding-bottom: 15px;
            border-bottom: 1px var(--text-second) solid;
        }

        .timer-box .time-right {
            color: var(--green);
            min-width: 60px;
            text-align: right;
        }

        .timer-box.timer-urgent .time-right,
        .car-card:has(.timer-urgent) .time-entry {
            color: var(--red);
        }

        @media (width <=768px) {
            body {
                padding-bottom: 120px;
            }

            .btn {
                position: fixed;
                bottom: var(--gap);
                z-index: 10;
            }

            .blur {
                display: block;
                position: fixed;
                width: 100%;
                height: 120px;
                bottom: 0;
                left: 0;
                background-color: var(--bg-l0);
                background: linear-gradient(to top,
                        rgba(0, 0, 0, 1) 0%,
                        rgba(0, 0, 0, 0.7) 50%,
                        rgba(0, 0, 0, 0) 100%);
                z-index: 9;
            }
        }
    </style>
</head>
<body>
    <header class="header">
        <h1>Активні черги</h1>
        <div class="btn">
            <button id="checkButton">Оновити чергу</button>
            <div id="updateInfo" class="update-info">Завантаження...</div>
        </div>
    </header>
    <div class="blur"></div>
    <div id="results"></div>

    <script>
        function formatPlateNumber(plate) {
            if (!plate) return 'Немає';
            const cleanPlate = plate.replace(/\s+/g, '');
            const match = cleanPlate.match(/^([a-zA-Zа-яА-ЯіІїЇєЄ]{2})(\d{4})([a-zA-Zа-яА-ЯіІїЇєЄ]{2})$/);
            if (match) return `${match[1].toUpperCase()} ${match[2]} ${match[3].toUpperCase()}`;
            return plate;
        }

        function parseUkrainianDate(dateString, baseDateIso) {
            if (!dateString) return null;
            const months = {
                'січня': 0, 'лютого': 1, 'березня': 2, 'квітня': 3, 'травня': 4, 'червня': 5,
                'липня': 6, 'серпня': 7, 'вересня': 8, 'жовтня': 9, 'листопада': 10, 'грудня': 11
            };
            const parts = dateString.trim().split(' ');
            if (parts.length < 3) return null;

            const day = parseInt(parts[0]);
            const month = months[parts[1].toLowerCase()];
            const timeParts = parts[2].split(':');
            const hours = parseInt(timeParts[0]);
            const minutes = parseInt(timeParts[1]);

            const baseDate = baseDateIso ? new Date(baseDateIso) : new Date();
            let year = baseDate.getFullYear();
            let date = new Date(year, month, day, hours, minutes);

            if (date.getTime() < baseDate.getTime() - 30 * 24 * 60 * 60 * 1000) {
                date.setFullYear(year + 1);
            }
            return date;
        }

        function getRemainingTimeText(targetDateStr, updatedAtIso) {
            const targetDate = parseUkrainianDate(targetDateStr, updatedAtIso);
            if (!targetDate) return "Невідомо";

            const baseTime = updatedAtIso ? new Date(updatedAtIso) : new Date();
            const diffMs = targetDate - baseTime;
            if (diffMs <= 0) return "Час вийшов";

            const diffMins = Math.floor(diffMs / 60000);

            const d = Math.floor(diffMins / (24 * 60));
            const h = Math.floor((diffMins % (24 * 60)) / 60);
            const m = diffMins % 60;

            let res = [];
            if (d > 0) res.push(`${d}д`);
            if (h > 0) res.push(`${h}г`);
            if (m > 0) res.push(`${m}хв`);

            return res.join(' ') || "0хв";
        }

        function updateTimestamp(count, isoDateString) {
            const dateObj = new Date(isoDateString);
            const dateStr = dateObj.toLocaleDateString('uk-UA', { day: '2-digit', month: '2-digit', year: 'numeric' });
            const timeStr = dateObj.toLocaleTimeString('uk-UA', { hour: '2-digit', minute: '2-digit' });
            document.getElementById('updateInfo').innerHTML = `(${count}) актуально станом на<br>${dateStr}, ${timeStr}`;
        }

        let currentDataStr = "";

        async function fetchData() {
            const btn = document.getElementById('checkButton');
            const resultsDiv = document.getElementById('results');

            btn.innerText = 'Оновлення...';
            resultsDiv.classList.add('loading');

            try {
                const url = `https://raw.githubusercontent.com/s0lidd/echerha/data/data.json?t=${Date.now()}`;
                const response = await fetch(url);

                if (!response.ok) throw new Error('Дані ще не створені або репозиторій приватний');

                const rawText = await response.text();

                if (rawText === currentDataStr) {
                    return;
                }

                currentDataStr = rawText;
                const data = JSON.parse(rawText);
                const queues = data.queues || [];

                if (queues.length === 0) {
                    resultsDiv.innerHTML = '<div style="text-align: center; padding: var(--gap); font-size: 18px;">Активних черг немає</div>';
                } else {
                    queues.sort((a, b) => {
                        const dA = a.details || {};
                        const dB = b.details || {};

                        const isUrgentA = !!dA.cancel_at;
                        const isUrgentB = !!dB.cancel_at;

                        const catA = isUrgentA ? 1 : (dA.estimated_time ? 2 : 3);
                        const catB = isUrgentB ? 1 : (dB.estimated_time ? 2 : 3);

                        if (catA !== catB) {
                            return catA - catB;
                        }

                        const timeStrA = isUrgentA ? dA.cancel_at : dA.estimated_time;
                        const timeStrB = isUrgentB ? dB.cancel_at : dB.estimated_time;

                        const dateA = parseUkrainianDate(timeStrA, data.updatedAt);
                        const dateB = parseUkrainianDate(timeStrB, data.updatedAt);

                        const tsA = dateA ? dateA.getTime() : Infinity;
                        const tsB = dateB ? dateB.getTime() : Infinity;

                        return tsA - tsB;
                    });

                    let htmlContent = '';

                    queues.forEach(item => {
                        const d = item.details;
                        const cp = item.checkpoint;

                        let timerHtml = '';
                        let displayTime = '';
                        let timeTitle = '';
                        let statusClass = '';

                        if (d.cancel_at) {
                            statusClass = 'status-urgent';
                            timeTitle = 'Чергу буде скасовано';
                            displayTime = d.cancel_at;
                            timerHtml = `
                            <div class="timer-box timer-urgent">
                                <div class="time-left">🚨 Ви вже маєте заїжджати до ММПП</div>
                                <div class="time-right">${getRemainingTimeText(d.cancel_at, data.updatedAt)}</div>
                            </div>`;
                        } else if (d.estimated_time) {
                            timeTitle = 'Орієнтовний час перетину кордону';
                            displayTime = d.estimated_time;
                            timerHtml = `
                            <div class="timer-box">
                                <div class="time-left">⏰ Час очікування</div>
                                <div class="time-right">${getRemainingTimeText(d.estimated_time, data.updatedAt)}</div>
                            </div>`;
                        }

                        const autoPlate = formatPlateNumber(d.plate_number);
                        const trailerPlate = formatPlateNumber(d.semi_trailer_number);

                        htmlContent += `
                        <div class="car-card ${statusClass}">
                            ${timerHtml}
                            <div>
                                <p>🚗 Авто / 🛒 Причіп</p>
                                <h3>${autoPlate} / ${trailerPlate}</h3>
                            </div>
                            <div>
                                <p>📍 ММПП</p>
                                <h3>${cp ? cp.title : 'Невідомо'}</h3>
                            </div>
                            <div>
                                <p class="time-entry">🏁 ${timeTitle}</p>
                                <h3>${displayTime}</h3>
                            </div>
                        </div>`;
                    });

                    resultsDiv.innerHTML = htmlContent;
                }

                updateTimestamp(queues.length, data.updatedAt);

            } catch (error) {
                console.error(error);
                if (currentDataStr === "") {
                    resultsDiv.innerHTML = `<div style="text-align: center; padding: var(--gap);">Помилка завантаження даних. Перевірте посилання в коді.</div>`;
                }
            } finally {
                btn.innerText = 'Оновити чергу';
                resultsDiv.classList.remove('loading');
            }
        }

        document.getElementById('checkButton').addEventListener('click', fetchData);
        fetchData();
        setInterval(() => {
            if (!document.hidden) fetchData();
        }, 60000);

        document.addEventListener('visibilitychange', () => {
            if (!document.hidden) fetchData();
        });
    </script>
</body>
</html>
